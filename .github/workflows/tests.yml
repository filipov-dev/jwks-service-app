name: Tests and Coverage

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same pin as the dev stand in deployments/dev/docker-compose.yml, so
        # the tests run against the database version development uses.
        image: postgres:13.23
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: jwk_db
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev
          cargo install diesel_cli --no-default-features --features postgres
          cargo install cargo-tarpaulin

      - name: Set up PostgreSQL environment
        run: |
          echo "DATABASE_URL=postgres://user:password@localhost:5432/jwk_db" >> $GITHUB_ENV

      - name: Prepare system
        run: |
          diesel migration run

      - name: Run tests
        run: cargo test

      - name: Run coverage
        run: cargo tarpaulin --ignore-tests # --out Lcov