version: '3.8'

services:
  db:
    # Pinned to a patch version: a floating tag (`postgres:13`, let alone
    # `:latest`) silently changes the database under the dev stand on the next
    # `docker compose pull`. Dependabot keeps the pin moving.
    #
    # A major bump carries no data across: the `postgres_data` volume written by
    # an older server is refused by a newer one at startup. The dev stand is
    # disposable, so the fix is `docker compose down -v` and a fresh migration
    # run, not an in-place upgrade.
    image: postgres:18.6
    environment:
      POSTGRES_USER: user  # PostgreSQL username
      POSTGRES_PASSWORD: password  # PostgreSQL password
      POSTGRES_DB: jwk_db  # PostgreSQL database name
    ports:
      - "5432:5432"  # Expose PostgreSQL port
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persist PostgreSQL data

  app:
    build:
      context: .  # Build context
      dockerfile: ./Dockerfile  # Path to Dockerfile
    environment:
      DATABASE_URL: postgres://user:password@db:5432/jwk_db  # Database connection URL
      RUN_MIGRATIONS_ON_START: 1  # Run migrations on startup (1 = true, 0 = false)
      PRIVATE_KEY_EXPIRATION_SECONDS: 86400  # time in seconds (default: 1 day)
      KEY_EXPIRATION_SECONDS: 172800  # time in seconds (default: 2 days)
      HOST: 0.0.0.0  # Bind to all interfaces so the service is reachable from the host
      PORT: 8080  # Port the service listens on
    command: tail -f /dev/null  # Keep the container running
    ports:
      - "8080:8080"  # Expose application port
    volumes:
      - ../..:/app  # Sync code between host and container
    depends_on:
      - db  # Depend on the PostgreSQL service

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.32.14  # Swagger UI image, pinned like the database
    ports:
      - "8081:8080"  # Expose Swagger UI port
    environment:
      API_URL: http://localhost:8080/api-docs/openapi.json  # OpenAPI specification URL
    depends_on:
      - app  # Depend on the application service

volumes:
  postgres_data:  # Volume for PostgreSQL data